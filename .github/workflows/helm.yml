name: Helm Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check AWS
        run: |
          aws --version

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name demo-cluster

      - name: Check Kubernetes
        run: |
          kubectl get nodes

      - name: Helm version
        run: |
          helm version

      - name: Deploy NGINX
        run: |
          helm upgrade --install myapp ./myapp -n dev

      - name: Deploy Redis
        run: |
          helm upgrade --install redis ./redis-chart -n dev

      - name: Verify deployments
        run: |
          kubectl get pods
          kubectl get svc
          helm list
